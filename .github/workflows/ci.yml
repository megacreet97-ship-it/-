name: CI

on:
  push:
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]:
                      print(d["udid"]); sys.exit()
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project StreetLog.xcodeproj \
            -scheme StreetLog \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch in simulator and take screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/StreetLog.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shoot() {
            NAME=$1; shift
            OUT=$(xcrun simctl launch "$UDID" "$BUNDLE_ID" -seedDemo YES "$@")
            PID=${OUT##*: }
            sleep 7
            if ! ps -p "$PID" > /dev/null; then
              echo "App crashed on $NAME"; exit 1
            fi
            xcrun simctl io "$UDID" screenshot "screenshots/$NAME.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID"
          }
          shoot 1-diary -initialTab 0
          shoot 2-master -initialTab 1
          shoot 3-analytics -initialTab 2
          shoot 4-profile -initialTab 3
          shoot 5-quicklog -initialTab 0 -demoScreen quicklog
          shoot 6-standards -initialTab 1 -demoScreen standards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
